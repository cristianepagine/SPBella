# Ambiente de DESENVOLVIMENTO. Produção terá um compose próprio em infra/ (história de deploy).
# Uso: cp .env.example .env && docker compose up --build
name: spbella

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spbella}
      POSTGRES_USER: ${POSTGRES_USER:-spbella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432" # só acessível desta máquina
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Papel da aplicação (criado pelo "db init"): não acessa salão nenhum sem SET ROLE.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-spbella_app}:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@db:5432/${POSTGRES_DB:-spbella}
      # Papel administrador: só a CLI usa (criar salões, migrações).
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:-spbella}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spbella}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro # recarrega ao salvar
      - ./backend/migrations:/app/migrations:ro
    # Em desenvolvimento, prepara o banco e migra os salões a cada subida (os dois são idempotentes).
    command:
      - sh
      - -c
      - >-
        python -m app.cli db init &&
        python -m app.cli tenants migrate --all &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
