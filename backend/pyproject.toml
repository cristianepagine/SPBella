[project]
name = "spbella-backend"
version = "0.13.0"
description = "API do SPBella — agendamento para salões de beleza e estética"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "tzdata>=2024.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "phonenumbers>=8.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]  # assert é normal nos testes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # senhas falsas de teste

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
