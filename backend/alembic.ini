# Uso direto do Alembic (para criar migrações). Para APLICAR, prefira a CLI:
#   uv run python -m app.cli db init            (public)
#   uv run python -m app.cli tenants migrate --all
#
# Criar migração do public:
#   uv run alembic -n public revision --autogenerate -m "descricao"
# Criar migração dos salões (precisa de um schema de salão já em dia para comparar):
#   uv run alembic -n tenant -x schema=t_studio_bella revision --autogenerate -m "descricao"
#
# A conexão vem de DATABASE_ADMIN_URL.

[public]
script_location = migrations/public
prepend_sys_path = .

[tenant]
# Um histórico só, com arquivos em uma pasta por módulo (core = template; salon = vertical).
version_locations = migrations/tenant/core migrations/tenant/salon
path_separator = space
script_location = migrations/tenant
prepend_sys_path = .
