name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spbella
          POSTGRES_USER: spbella
          POSTGRES_PASSWORD: spbella
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spbella" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Superusuário do Postgres de teste: os testes criam bancos e papéis próprios.
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://spbella:spbella@localhost:5432/postgres
      # Falha (em vez de pular) se os testes com banco, como os de isolamento, não puderem rodar.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes (isolamento entre salões, openapi.json em dia, etc.)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos da API em dia com docs/api/openapi.json
        run: npm run check:api
      - name: Traduções pt-BR e es com as mesmas chaves
        run: npm run check:i18n
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o ambiente de desenvolvimento
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Cria os salões de demonstração e consulta pela API
        run: |
          docker compose exec -T api python -m app.cli tenants seed-demo
          docker compose exec -T api python -m app.cli tenants list
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/t/studio-bella | grep -q '"currency":"BRL"'
          curl -fsS http://localhost:8000/t/salon-asuncion | grep -q '"currency":"PYG"'
      - name: Login de demonstração ponta a ponta
        run: |
          curl -fsS -c cookies.txt -X POST http://localhost:8000/t/studio-bella/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dono@studio-bella.demo","password":"demo-spbella"}' -o login.json
          TOKEN=$(python3 -c "import json; print(json.load(open('login.json'))['access_token'])")
          curl -fsS http://localhost:8000/t/studio-bella/auth/me -H "Authorization: Bearer $TOKEN"
          curl -fsS -b cookies.txt -X POST http://localhost:8000/t/studio-bella/auth/refresh -o /dev/null
          # recepção não acessa a equipe (403); dono acessa
          curl -fsS -X POST http://localhost:8000/t/studio-bella/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"recepcao@studio-bella.demo","password":"demo-spbella"}' -o recepcao.json
          RECEPCAO=$(python3 -c "import json; print(json.load(open('recepcao.json'))['access_token'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/t/studio-bella/team \
            -H "Authorization: Bearer $RECEPCAO")" = "403"
          curl -fsS http://localhost:8000/t/studio-bella/team -H "Authorization: Bearer $TOKEN" -o /dev/null
          # dono muda o fuso nas configurações e a página pública reflete na hora
          curl -fsS -X PATCH http://localhost:8000/t/studio-bella/settings \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"timezone":"America/Manaus"}' -o /dev/null
          curl -fsS http://localhost:8000/t/studio-bella | grep -q '"timezone":"America/Manaus"'
          # recepção cadastra cliente; dono vê no histórico; recepção não vê a auditoria
          CLIENTE=$(curl -fsS -X POST http://localhost:8000/t/studio-bella/customers \
            -H "Authorization: Bearer $RECEPCAO" -H 'Content-Type: application/json' \
            -d '{"name":"Cliente CI","phone":"(11) 98888-7777","consents":["service"]}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          # busca sem acento/maiúsculas e por parte do telefone (SAL-07)
          curl -fsS -G http://localhost:8000/t/studio-bella/customers --data-urlencode "q=CLIENTE ci" \
            -H "Authorization: Bearer $RECEPCAO" | grep -q '"total":1'
          curl -fsS -G http://localhost:8000/t/studio-bella/customers --data-urlencode "q=98888-77" \
            -H "Authorization: Bearer $RECEPCAO" | grep -q '"Cliente CI"'
          curl -fsS "http://localhost:8000/t/studio-bella/audit?entity_id=$CLIENTE" \
            -H "Authorization: Bearer $TOKEN" | grep -q '"customer.created"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/t/studio-bella/audit \
            -H "Authorization: Bearer $RECEPCAO")" = "403"
          # salão novo já vem com os serviços de exemplo (SAL-01/05); recepção vê, não edita
          curl -fsS http://localhost:8000/t/studio-bella/services -H "Authorization: Bearer $RECEPCAO" \
            | grep -q '"Corte feminino"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/t/studio-bella/services \
            -H "Authorization: Bearer $RECEPCAO" -H 'Content-Type: application/json' \
            -d '{"name":"X","duration_min":30,"price_minor":100}')" = "403"
          # demonstração tem 3 profissionais com jornadas; recepção vê a lista, não edita
          curl -fsS http://localhost:8000/t/studio-bella/providers -H "Authorization: Bearer $RECEPCAO" \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert len(d) == 3, d; \
          assert len({tuple(map(str, p['working_hours'])) for p in d}) == 3"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/t/studio-bella/providers \
            -H "Authorization: Bearer $RECEPCAO" -H 'Content-Type: application/json' \
            -d '{"name":"X"}')" = "403"
          # agenda da semana da demonstração tem agendamentos; o banco tem a trava de dupla reserva
          SEMANA=$(date -u -d "yesterday" +%F)
          curl -fsS "http://localhost:8000/t/studio-bella/agenda?start=$SEMANA&days=7" \
            -H "Authorization: Bearer $RECEPCAO" \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['appointments'], d"
          docker compose exec -T db psql -U spbella -d spbella -tAc \
            "SELECT 1 FROM pg_constraint WHERE conname = 'ex_appointments_no_double_booking'" | grep -q 1
          # recepção marca um horário (encaixe às 23:00 de daqui a 30 dias); o mesmo horário de novo = 409
          AGENDA=$(curl -fsS "http://localhost:8000/t/studio-bella/agenda?start=$SEMANA&days=7" \
            -H "Authorization: Bearer $RECEPCAO")
          BODY=$(echo "$AGENDA" | python3 -c "import sys, json, datetime as d; a = json.load(sys.stdin)['appointments'][0]; \
          t = (d.datetime.now(d.UTC) + d.timedelta(days=30)).replace(hour=2, minute=0, second=0, microsecond=0); \
          print(json.dumps({'provider_id': a['provider_id'], 'offering_id': a['offering_id'], \
          'customer_id': a['customer_id'], 'starts_at': t.isoformat(), 'allow_outside_hours': True}))")
          curl -fsS -X POST http://localhost:8000/t/studio-bella/appointments -H "Authorization: Bearer $RECEPCAO" \
            -H 'Content-Type: application/json' -d "$BODY" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/t/studio-bella/appointments \
            -H "Authorization: Bearer $RECEPCAO" -H 'Content-Type: application/json' -d "$BODY")" = "409"
          # o token de um salão não vale no outro
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/t/salon-asuncion/auth/me \
            -H "Authorization: Bearer $TOKEN")" = "401"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
