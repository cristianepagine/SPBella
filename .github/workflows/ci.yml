name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spbella
          POSTGRES_USER: spbella
          POSTGRES_PASSWORD: spbella
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spbella" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Superusuário do Postgres de teste: os testes criam bancos e papéis próprios.
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://spbella:spbella@localhost:5432/postgres
      # Falha (em vez de pular) se os testes com banco, como os de isolamento, não puderem rodar.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes (isolamento entre salões, openapi.json em dia, etc.)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos da API em dia com docs/api/openapi.json
        run: npm run check:api
      - name: Traduções pt-BR e es com as mesmas chaves
        run: npm run check:i18n
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o ambiente de desenvolvimento
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Cria os salões de demonstração e consulta pela API
        run: |
          docker compose exec -T api python -m app.cli tenants seed-demo
          docker compose exec -T api python -m app.cli tenants list
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/t/studio-bella | grep -q '"currency":"BRL"'
          curl -fsS http://localhost:8000/t/salon-asuncion | grep -q '"currency":"PYG"'
      - name: Login de demonstração ponta a ponta
        run: |
          curl -fsS -c cookies.txt -X POST http://localhost:8000/t/studio-bella/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dono@studio-bella.demo","password":"demo-spbella"}' -o login.json
          TOKEN=$(python3 -c "import json; print(json.load(open('login.json'))['access_token'])")
          curl -fsS http://localhost:8000/t/studio-bella/auth/me -H "Authorization: Bearer $TOKEN"
          curl -fsS -b cookies.txt -X POST http://localhost:8000/t/studio-bella/auth/refresh -o /dev/null
          # o token de um salão não vale no outro
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/t/salon-asuncion/auth/me \
            -H "Authorization: Bearer $TOKEN")" = "401"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
